<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curățenie & Mentenanță — Lokals</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --teal-deep:#10302B; --teal:#1A4A42; --gold:#C98A2C; --gold-soft:#E8CE9E;
    --cream:#F7F2E8; --ink:#181E1B; --ink-soft:#5B6459; --line:#DCD5C6; --brick:#9C4536; --brick-soft:#F1E3DF;
    --green-soft:#E3ECE4;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); font-family:'Inter', system-ui, sans-serif; color:var(--ink);}
  a{color:var(--teal-deep);}
  .serif{font-family:'Fraunces', Georgia, serif;}
  main{max-width:640px; margin:0 auto; padding:22px 16px 60px;}
  .back-link{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-decoration:none; display:inline-block; margin-bottom:14px;}
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:20px;}
  .page-title{font-size:22px; font-weight:700; color:var(--teal-deep);}
  .page-sub{font-size:13px; color:var(--ink-soft); margin-top:3px;}
  .addon-tag{display:inline-flex; align-items:center; gap:5px; background:var(--gold-soft); color:#8F6222; font-size:10px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; padding:4px 9px; border-radius:999px; flex-shrink:0; margin-top:2px;}

  .card{background:#fff; border-radius:16px; box-shadow:0 4px 16px rgba(16,48,43,0.07); padding:18px; margin-bottom:14px;}
  .card-label{font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--gold); text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:7px;}
  .card-label svg{flex-shrink:0;}

  .cta-card{background:var(--teal-deep); border-radius:16px; padding:20px; margin-bottom:14px; color:#fff;}
  .cta-title{font-size:15.5px; font-weight:700; margin-bottom:4px;}
  .cta-sub{font-size:12.5px; color:#C8CFC2; line-height:1.5; margin-bottom:14px;}
  .cta-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:#25A160; color:#fff; border:none;
    font-size:14px; font-weight:700; padding:13px; border-radius:12px; cursor:pointer; font-family:inherit;}
  .cta-btn:disabled{opacity:.6; cursor:default;}

  .status-row{display:flex; align-items:center; gap:12px;}
  .status-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .status-dot.wait{background:var(--gold);} .status-dot.done{background:#2F8F5B;} .status-dot.none{background:var(--line);}
  .status-text{flex:1;}
  .status-main{font-size:13.5px; font-weight:700; color:var(--ink);}
  .status-time{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .status-link{font-size:12px; font-weight:700; color:var(--teal-deep); text-decoration:none; white-space:nowrap;}

  .supply-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);}
  .supply-row:last-child{border-bottom:none;}
  .supply-name{font-size:13px; color:var(--ink);}
  .supply-flag{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em;}
  .supply-flag.ok{background:var(--green-soft); color:var(--teal-deep);}
  .supply-flag.low{background:var(--brick-soft); color:var(--brick);}
  .manage-link{display:block; text-align:center; font-size:12.5px; font-weight:700; color:var(--teal-deep); text-decoration:none; margin-top:10px;}

  .issue-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
  .issue-row:last-child{border-bottom:none;}
  .issue-icon{width:30px; height:30px; border-radius:9px; background:var(--brick-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .issue-body{flex:1; min-width:0;}
  .issue-text{font-size:13px; color:var(--ink); line-height:1.4;}
  .issue-meta{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .issue-resolve-btn{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:5px 9px; border-radius:999px; flex-shrink:0;
    background:var(--brick-soft); color:var(--brick); border:none; cursor:pointer; font-family:inherit;}
  .empty-note{font-size:12.5px; color:var(--ink-soft);}

  .hist-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; font-size:12.5px;}
  .hist-date{color:var(--ink);} .hist-staff{color:var(--ink-soft);}
  .hist-badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;}
  .hist-badge.done{background:var(--green-soft); color:var(--teal-deep);}
  .hist-badge.wait{background:var(--gold-soft); color:#8F6222;}

  .lock-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;}
  .lock-card{background:#fff; border-radius:18px; padding:28px 26px; max-width:380px; text-align:center; box-shadow:0 14px 34px rgba(16,48,43,0.18); border:1px solid var(--line);}
  .lock-icon{width:44px; height:44px; border-radius:12px; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  .lock-title{font-size:16px; font-weight:700; color:var(--teal-deep); margin-bottom:6px;}
  .lock-sub{font-size:13px; color:var(--ink-soft); line-height:1.55; margin-bottom:18px;}
  .lock-btn{display:inline-block; background:var(--teal-deep); color:#fff; font-size:13.5px; font-weight:700; padding:11px 22px; border-radius:999px; cursor:pointer; border:none; font-family:inherit; text-decoration:none;}
</style>
</head>
<body>

<div style="background:var(--teal-deep); padding:16px 18px; display:flex; align-items:center; justify-content:space-between;">
  <a href="index.html" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
    <span style="width:22px; height:22px; border-radius:50%; background:var(--gold); position:relative; display:inline-block;">
      <span style="position:absolute; inset:6px; border-radius:50%; background:var(--teal-deep);"></span>
    </span>
    <span style="font-family:'Poppins', sans-serif; font-weight:700; color:#fff; font-size:17px;">lokals</span>
  </a>
  <div style="display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); padding:6px 12px; border-radius:999px;">
    <span id="header-auth-name" style="font-size:12px; font-weight:600; color:#fff;"></span>
    <span id="header-logout-btn" style="font-size:10.5px; color:var(--gold-soft); border-left:1px solid rgba(255,255,255,0.25); padding-left:8px; cursor:pointer;">Ieși din cont</span>
  </div>
</div>

<main>
  <div id="state-loading" style="padding:40px 0; text-align:center; color:var(--ink-soft); font-size:14px;">Se încarcă...</div>

  <div id="state-noauth" style="display:none; text-align:center; padding:40px 0;">
    <p class="serif" style="font-size:20px; font-weight:700; color:var(--teal-deep);">Trebuie să te autentifici</p>
    <a href="cont.html" style="display:inline-block; background:var(--teal-deep); color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; font-weight:700; text-decoration:none;">Autentifică-te</a>
  </div>

  <div id="state-nomatch" style="display:none; text-align:center; padding:40px 0;">
    <p class="serif" style="font-size:20px; font-weight:700; color:var(--teal-deep);">Nu am găsit nicio cazare pe acest cont</p>
  </div>

  <div id="state-form" style="display:none;">
    <a class="back-link" href="contul-meu.html">← Înapoi la proprietățile mele</a>

    <div class="page-head">
      <div>
        <div class="page-title serif">Curățenie &amp; Mentenanță</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <span class="addon-tag">Add-on</span>
    </div>

    <div style="position:relative;" id="dash-wrap">
      <div id="dash-content"></div>
      <div id="lock-overlay-wrap"></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://mwtodfcwuwzgnkohxpwi.supabase.co";
const SUPABASE_KEY = "sb_publishable_5I9zz5OjPkB7yuew0cWBVA_mmmxSjhf";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_ITEMS = [
  'Hârtie igienică', 'Săpun lichid', 'Gel de duș', 'Cafea', 'Ceai', 'Zahăr',
  'Burete de vase (nou)', 'Pungi de gunoi', 'Detergent de vase',
];

let operator = null;
let sessions = [];
let consumabile = [];

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function displayName(user) {
  const meta = user.user_metadata || {};
  if (meta.prenume) {
    const initial = meta.nume ? meta.nume.trim().charAt(0).toUpperCase() + '.' : '';
    return `${meta.prenume} ${initial}`.trim();
  }
  return user.email;
}
function showState(id) {
  ['state-loading', 'state-noauth', 'state-nomatch', 'state-form'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? '' : 'none';
  });
}
function fmtDateTime(d){
  return new Date(d).toLocaleString('ro-RO', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function checklistLink(token){
  return `${window.location.origin}${window.location.pathname.replace(/curatenie-mentenanta\.html$/, '')}checklist-curatenie.html?token=${encodeURIComponent(token)}`;
}

async function sendCleaningRequest(){
  const btn = document.getElementById('cta-btn');
  btn.disabled = true;
  const { data, error } = await supabaseClient.from('curatenie_sesiuni')
    .insert({ operator_id: operator.id })
    .select('*');
  btn.disabled = false;
  if (error) { console.error(error); alert('Nu am putut crea sesiunea. Încearcă din nou.'); return; }
  const newSession = data[0];
  sessions.unshift(newSession);

  const nume = operator.nume_afisat || operator.nume_afacere || 'apartamentul';
  const link = checklistLink(newSession.token);
  const mesaj = `Salut! ${nume} trebuie curățat. Poți completa checklist-ul aici: ${link}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(mesaj)}`, '_blank');

  renderDash();
}

async function resolveIssue(sessionId){
  const { error } = await supabaseClient.from('curatenie_sesiuni').update({ probleme: null }).eq('id', sessionId);
  if (error) { console.error(error); alert('Nu am putut actualiza problema.'); return; }
  const s = sessions.find(s => String(s.id) === String(sessionId));
  if (s) s.probleme = null;
  renderDash();
}

function statusCardHtml(){
  if (!sessions.length) {
    return `
      <div class="card">
        <div class="card-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C98A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Curățenia curentă
        </div>
        <div class="status-row">
          <span class="status-dot none"></span>
          <div class="status-text">
            <div class="status-main">Nicio cerere trimisă încă</div>
          </div>
        </div>
      </div>`;
  }
  const latest = sessions[0];
  const dotClass = latest.status === 'finalizat' ? 'done' : 'wait';
  const main = latest.status === 'finalizat'
    ? `Finalizată — checklist completat de ${escapeHtml(latest.staff_name || '—')}`
    : `În așteptare — checklist trimis, încă neconfirmat`;
  const time = latest.status === 'finalizat'
    ? `Trimisă ${fmtDateTime(latest.created_at)} · Confirmată ${fmtDateTime(latest.completed_at)}`
    : `Trimisă ${fmtDateTime(latest.created_at)}`;
  return `
    <div class="card">
      <div class="card-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C98A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Curățenia curentă
      </div>
      <div class="status-row">
        <span class="status-dot ${dotClass}"></span>
        <div class="status-text">
          <div class="status-main">${main}</div>
          <div class="status-time">${time}</div>
        </div>
      </div>
    </div>`;
}

function consumablesCardHtml(){
  const latestFinalized = sessions.find(s => s.status === 'finalizat');
  const lowSet = new Set((latestFinalized && latestFinalized.stoc_scazut) || []);
  const rows = consumabile.map(item => `
    <div class="supply-row">
      <span class="supply-name">${escapeHtml(item.nume)}</span>
      <span class="supply-flag ${lowSet.has(item.nume) ? 'low' : 'ok'}">${lowSet.has(item.nume) ? 'Semnalat — stoc scăzut' : 'OK'}</span>
    </div>
  `).join('');
  return `
    <div class="card">
      <div class="card-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C98A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v20"/><path d="M6 2c0 4 3 4 3 8s-3 4 -3 8"/><path d="M18 2v20"/></svg>
        Consumabile
      </div>
      ${rows || '<div class="empty-note">Nicio consumabilă în listă încă.</div>'}
      <a class="manage-link" href="consumabile-curatenie.html?slug=${encodeURIComponent(operator.slug)}">Gestionează lista de consumabile →</a>
    </div>`;
}

function issuesCardHtml(){
  const withIssues = sessions.filter(s => s.probleme);
  const rows = withIssues.map(s => `
    <div class="issue-row">
      <div class="issue-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9C4536" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L2.6 17a1.8 1.8 0 0 0 1.55 2.7h15.7a1.8 1.8 0 0 0 1.55 -2.7L13.7 3.9a1.8 1.8 0 0 0 -3.4 0z"/></svg>
      </div>
      <div class="issue-body">
        <div class="issue-text">${escapeHtml(s.probleme)}</div>
        <div class="issue-meta">Semnalat de ${escapeHtml(s.staff_name || '—')} · ${fmtDateTime(s.completed_at || s.created_at)}</div>
      </div>
      <button class="issue-resolve-btn" type="button" data-resolve="${s.id}">Rezolvat</button>
    </div>
  `).join('');
  return `
    <div class="card">
      <div class="card-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C98A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L2.6 17a1.8 1.8 0 0 0 1.55 2.7h15.7a1.8 1.8 0 0 0 1.55 -2.7L13.7 3.9a1.8 1.8 0 0 0 -3.4 0z"/></svg>
        Probleme semnalate
      </div>
      ${rows || '<div class="empty-note">Nicio problemă semnalată momentan.</div>'}
    </div>`;
}

function historyCardHtml(){
  const rows = sessions.slice(0, 6).map(s => `
    <div class="hist-row">
      <span class="hist-date">${fmtDateTime(s.created_at)}</span>
      <span class="hist-staff">${escapeHtml(s.staff_name || '—')}</span>
      <span class="hist-badge ${s.status === 'finalizat' ? 'done' : 'wait'}">${s.status === 'finalizat' ? 'Finalizată' : 'În așteptare'}</span>
    </div>
  `).join('');
  return `
    <div class="card">
      <div class="card-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C98A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4 -4 3 3 5 -6"/></svg>
        Istoric curățenii
      </div>
      ${rows || '<div class="empty-note">Niciun istoric momentan.</div>'}
    </div>`;
}

function renderDash(){
  const locked = !operator.curatenie_activ;

  document.getElementById('dash-content').innerHTML = `
    <div style="opacity:${locked ? '0.35' : '1'}; filter:${locked ? 'blur(3px)' : 'none'}; pointer-events:${locked ? 'none' : 'auto'};">
      <div class="cta-card">
        <div class="cta-title">Anunță că apartamentul trebuie curățat</div>
        <div class="cta-sub">Se deschide WhatsApp cu mesajul pregătit — alegi tu cui îl trimiți (persoana sau firma care face curățenia de această dată). Linkul din mesaj e unic pentru sesiunea asta; cine îl deschide își scrie numele pe checklist.</div>
        <button class="cta-btn" type="button" id="cta-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 3.4l-5.05 1.4"/></svg>
          Trimite pe WhatsApp
        </button>
      </div>
      ${statusCardHtml()}
      ${consumablesCardHtml()}
      ${issuesCardHtml()}
      ${historyCardHtml()}
    </div>
  `;

  const lockWrap = document.getElementById('lock-overlay-wrap');
  if (locked) {
    const subject = encodeURIComponent(`Activare Curățenie & Mentenanță — ${operator.nume_afacere || ''}`);
    const body = encodeURIComponent(`Salut Nico,\n\nAș vrea să activezi modulul de Curățenie & Mentenanță pentru proprietatea mea "${operator.nume_afacere || ''}" (${operator.slug || ''}).\n\nMulțumesc!`);
    lockWrap.innerHTML = `
      <div class="lock-overlay">
        <div class="lock-card">
          <div class="lock-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8F6222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11v-4a4 4 0 0 1 8 0v4"/></svg>
          </div>
          <div class="lock-title serif">Modul disponibil ca add-on</div>
          <div class="lock-sub">Curățenie &amp; Mentenanță se activează separat pentru contul tău — coordonezi firma de curățenie, consumabilele și problemele de mentenanță direct din Lokals.</div>
          <a class="lock-btn" href="mailto:nico@lokals.ro?subject=${subject}&body=${body}">Cere activarea modulului</a>
        </div>
      </div>`;
  } else {
    lockWrap.innerHTML = '';
    document.getElementById('cta-btn').addEventListener('click', sendCleaningRequest);
    document.querySelectorAll('[data-resolve]').forEach(btn => {
      btn.addEventListener('click', () => resolveIssue(btn.dataset.resolve));
    });
  }
}

async function init() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session || !session.user) { showState('state-noauth'); return; }
  document.getElementById('header-auth-name').textContent = displayName(session.user);

  const requestedSlug = new URLSearchParams(window.location.search).get('slug');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/operatori?email=eq.${encodeURIComponent(session.user.email)}&select=*`, { headers: { apikey: SUPABASE_KEY } });
  const cazari = await res.json();
  if (!cazari.length) { showState('state-nomatch'); return; }
  operator = (requestedSlug && cazari.find(r => r.slug === requestedSlug)) || cazari[0];

  document.getElementById('page-sub').textContent = operator.nume_afisat || operator.nume_afacere || '';

  const [sesRes, consRes] = await Promise.all([
    supabaseClient.from('curatenie_sesiuni').select('*').eq('operator_id', operator.id).order('created_at', { ascending: false }).limit(20),
    supabaseClient.from('curatenie_consumabile').select('*').eq('operator_id', operator.id).order('ordine', { ascending: true }),
  ]);
  sessions = sesRes.data || [];
  consumabile = consRes.data || [];

  if (!consumabile.length && operator.curatenie_activ) {
    const seed = DEFAULT_ITEMS.map((nume, i) => ({ operator_id: operator.id, nume, implicit: true, ordine: i }));
    const { data: inserted } = await supabaseClient.from('curatenie_consumabile').insert(seed).select('*');
    consumabile = inserted || [];
  }

  renderDash();
  showState('state-form');
}

document.getElementById('header-logout-btn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.href = 'index.html';
});

init();
</script>

</body>
</html>
